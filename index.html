<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114~115年在職時數時數計算器-僅適用於臺北市（116年換證者不適用）</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 880px;
        }
        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 35px;
            font-size: 24px;
            border-bottom: 2px solid #2563eb;
            padding-bottom: 15px;
        }
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 14px;
        }
        .form-group label {
            flex: 1;
            font-weight: 600;
            color: #475569;
            font-size: 15px;
            padding-right: 30px;
            line-height: 1.6;
        }
        .input-block {
            display: flex;
            align-items: center;
            flex: 0 0 240px; 
            justify-content: flex-end;
            gap: 4px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
            text-align: center;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #2563eb;
            outline: none;
        }
        .form-group input[readonly] {
            background-color: #f8fafc;
            color: #64748b;
            border: 1px solid #e2e8f0;
            cursor: not-allowed;
        }
        .user-input {
            background-color: #fefce8;
            border: 1px solid #eab308 !important;
        }
        .year-input { width: 65px !important; }
        .date-select { width: 55px !important; }
        
        .unit {
            margin-left: 6px;
            color: #64748b;
            min-width: 45px;
            font-size: 14px;
            text-align: left;
        }
        .dynamic-highlight {
            color: #2563eb;
            font-weight: bold;
            background-color: #eff6ff;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 35px;
        }
        .btn-action {
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-print {
            background-color: #27ae60;
        }
        .btn-print:hover {
            background-color: #219150;
        }
        .btn-clear {
            background-color: #ef4444;
        }
        .btn-clear:hover {
            background-color: #dc2626;
        }

        @media print {
            .no-print { display: none; }
            body { background: white; padding: 0; }
            .container { box-shadow: none; border: none; width: 100%; max-width: 100%; padding: 10px; }
            .user-input { background-color: transparent !important; border: none !important; border-bottom: 1px solid #334155 !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>114~115年在職時數時數計算器-僅適用於臺北市（116年換證者不適用）</h2>
    
    <div class="form-group">
        <label for="name">『姓名』：</label>
        <div class="input-block">
            <input type="text" id="name" class="user-input" placeholder="請輸入姓名" style="text-align: left;">
            <div class="unit"></div>
        </div>
    </div>
    
    <div class="form-group">
        <label>一、『登記證書到期日（登記證書底下的年月日）』：</label>
        <div class="input-block">
            <input type="number" id="docYear" class="user-input year-input" placeholder="民國" min="1" oninput="calculate()">
            <span style="font-size:13px; color:#64748b;">年</span>
            <select id="docMonth" class="user-input date-select" onchange="calculate()">
                <option value="">--</option>
            </select>
            <span style="font-size:13px; color:#64748b;">月</span>
            <select id="docDay" class="user-input date-select" onchange="calculate()">
                <option value="">--</option>
            </select>
            <span style="font-size:13px; color:#64748b;">日</span>
        </div>
    </div>
    
    <div class="form-group">
        <label for="row2">二、『114年在職年度到期日（等同登記證書底下的月日）』：</label>
        <div class="input-block">
            <input type="text" id="row2" readonly placeholder="系統自動對照">
            <div class="unit"></div>
        </div>
    </div>
    
    <div class="form-group">
        <label for="row3">三、『114年後半段月份數』：</label>
        <div class="input-block">
            <input type="text" id="row3" readonly placeholder="自動計算">
            <div class="unit">個月</div>
        </div>
    </div>
    
    <div class="form-group">
        <label for="row4">四、『114年應完成時數』：</label>
        <div class="input-block">
            <input type="text" id="row4" readonly placeholder="自動計算">
            <div class="unit">小時</div>
        </div>
    </div>
    
    <div class="form-group">
        <label id="label-row5">五、『114年「（<span class="dynamic-highlight" id="dynamic-date">『二』的日期</span>）至114/12/31」已完成時數(採認上限18小時)』：</label>
        <div class="input-block">
            <input type="number" id="row5" class="user-input" min="0" max="18" step="0.5" placeholder="自行輸入" oninput="calculate()">
            <div class="unit">小時</div>
        </div>
    </div>
    
    <div class="form-group" style="border-bottom: 2px solid #cbd5e1; padding-bottom: 20px;">
        <label for="row6" style="color: #b91c1c;">六、『115年需要完成的時數』：</label>
        <div class="input-block">
            <input type="text" id="row6" readonly placeholder="自動計算" style="font-weight: bold; color: #b91c1c; background-color: #fef2f2;">
            <div class="unit" style="color: #b91c1c; font-weight: bold;">小時</div>
        </div>
    </div>

    <div class="btn-container no-print">
        <button class="btn-action btn-print" onclick="window.print()">列印報表</button>
        <button class="btn-action btn-clear" onclick="clearForm()">清除所有資料</button>
    </div>
</div>

<script>
window.onload = function() {
    const monthSelect = document.getElementById('docMonth');
    for (let m = 1; m <= 12; m++) {
        monthSelect.options.add(new Option(m, m));
    }
    const daySelect = document.getElementById('docDay');
    for (let d = 1; d <= 31; d++) {
        daySelect.options.add(new Option(d, d));
    }
}

function calculate() {
    const yearVal = document.getElementById('docYear').value;
    const monthVal = parseInt(document.getElementById('docMonth').value);
    const dayVal = parseInt(document.getElementById('docDay').value);
    
    const row2Input = document.getElementById('row2');
    const row3Input = document.getElementById('row3');
    const row4Input = document.getElementById('row4');
    const row6Input = document.getElementById('row6');
    const dynamicDateSpan = document.getElementById('dynamic-date');
    const row5Input = document.getElementById('row5');

    if (!yearVal || isNaN(monthVal) || isNaN(dayVal)) {
        row2Input.value = '';
        row3Input.value = '';
        row4Input.value = '';
        row6Input.value = '';
        dynamicDateSpan.innerText = '『二』的日期';
        return;
    }

    const displayMonth = monthVal < 10 ? '0' + monthVal : monthVal;
    const displayDay = dayVal < 10 ? '0' + dayVal : dayVal;
    
    // 依據規則：「二」的日期加一天處理提示文字
    let nextDay = dayVal + 1;
    let nextMonth = monthVal;
    let daysInMonth = new Date(114 + 1911, monthVal, 0).getDate();
    
    if (nextDay > daysInMonth) {
        nextDay = 1;
        nextMonth += 1;
    }
    const nextDisplayMonth = nextMonth < 10 ? '0' + nextMonth : nextMonth;
    const nextDisplayDay = nextDay < 10 ? '0' + nextDay : nextDay;

    const dateString114 = `114年${displayMonth}月${displayDay}日`;
    const nextDateString114 = `114/${nextDisplayMonth}/${nextDisplayDay}`;
    
    row2Input.value = dateString114;
    dynamicDateSpan.innerText = `${nextDateString114}`;

    // 三、『114年後半段月份數』＝『二』日期的下一個月至年底的月份數
    // 規則說明：例如登記日是 10 月，下一個月為 11 月至 12 月，共 2 個月（12 - monthVal）
    const row3 = 12 - monthVal;
    row3Input.value = row3 >= 0 ? row3 : 0;

    // 四、『114年應完成時數』=(『三』的月份數乘上1.5小時）
    const row4 = row3 * 1.5;
    row4Input.value = Math.round(row4 * 10) / 10;

    let row5Value = parseFloat(row5Input.value);
    if (isNaN(row5Value)) {
        row5Value = 0;
    }
    if (row5Value < 0) {
        row5Value = 0;
        row5Input.value = 0;
    }
    if (row5Value > 18) {
        row5Value = 18;
        row5Input.value = 18;
    }

    // 六、『115年需要完成的時數』=18+『四』時數-『五』的時數
    const row6 = 18 + row4 - row5Value;
    row6Input.value = Math.round(row6 * 10) / 10;
}

function clearForm() {
    document.getElementById('name').value = '';
    document.getElementById('docYear').value = '';
    document.getElementById('docMonth').value = '';
    document.getElementById('docDay').value = '';
    document.getElementById('row2').value = '';
    document.getElementById('row3').value = '';
    document.getElementById('row4').value = '';
    document.getElementById('row5').value = '';
    document.getElementById('row6').value = '';
    document.getElementById('dynamic-date').innerText = '『二』的日期';
}
</script>

</body>
</html>
